<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta
      name="description"
      content="Private administration console for Garage object storage."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="theme-color"
      content="#0B0C0F"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#EAEBEE"
      media="(prefers-color-scheme: light)"
    />
    <title>Garage · Storage console</title>
    <script>
      window.__BASE_PATH = "%BASE_PATH%";
      // Apply an explicit light or dark choice before first paint. With none (System) no attribute is set, and the
      // tokens follow the OS preference through prefers-color-scheme.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem("appdata") || "null");
          var theme = saved && saved.state && saved.state.theme;
          if (theme === "light" || theme === "dark")
            document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>Garage console needs JavaScript enabled.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
